<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NetScanner</title>
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-icon">⬡</span>
        <div class="auth-logo-text">NETSCANNER</div>
        <div class="auth-logo-sub">NETWORK INTELLIGENCE PLATFORM</div>
      </div>

      <div id="alertBox" class="alert alert-error hidden"></div>

      <form id="loginForm" novalidate autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input class="form-control" type="email" id="email" placeholder="operator@domain.com" required>
          </div>
          <div class="field-error" id="emailErr">Valid email required</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input class="form-control" type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
              <span class="eye-icon" id="eyeIcon">👁</span>
            </button>
          </div>
          <div class="field-error" id="passErr">Password required</div>
        </div>

        <div class="form-group remember-me-group">
          <label class="remember-me-label">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn-auth" id="submitBtn">
          <span id="btnText">ACCESS TERMINAL</span>
          <span id="btnSpinner" style="display:none">AUTHENTICATING…</span>
        </button>
      </form>

      <div class="auth-divider"><span>OR</span></div>

      <div class="auth-links">
        <a href="{{ url_for('pages.signup') }}">Create new operator account</a>
        &nbsp;·&nbsp;
        <a href="#">Reset password</a>
      </div>
    </div>
  </div>

  <script>
    const form      = document.getElementById('loginForm');
    const alertBox  = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText   = document.getElementById('btnText');
    const btnSpin   = document.getElementById('btnSpinner');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeIcon = document.getElementById('eyeIcon');
    const rememberMe = document.getElementById('rememberMe');

    // Password visibility toggle
    passwordToggle.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.textContent = type === 'password' ? '👁' : '👁️‍🗨️';
    });

    // Load saved email if remember me was checked
    window.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('rememberedEmail');
      const wasRemembered = localStorage.getItem('rememberMe') === 'true';
      if (savedEmail && wasRemembered) {
        document.getElementById('email').value = savedEmail;
        rememberMe.checked = true;
      }
    });

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    function setLoading(v) {
      submitBtn.disabled = v;
      btnText.style.display  = v ? 'none'  : '';
      btnSpin.style.display  = v ? ''      : 'none';
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = rememberMe.checked;

      document.getElementById('emailErr').classList.remove('visible');
      document.getElementById('passErr').classList.remove('visible');

      let valid = true;
      if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        document.getElementById('emailErr').classList.add('visible');
        document.getElementById('email').classList.add('is-invalid');
        valid = false;
      }
      if (!password) {
        document.getElementById('passErr').classList.add('visible');
        document.getElementById('password').classList.add('is-invalid');
        valid = false;
      }
      if (!valid) return;

      setLoading(true);
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'include',
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('auth', 'true');
          if (data.csrf_token) localStorage.setItem('csrf_token', data.csrf_token);
          
          // Handle remember me
          if (remember) {
            localStorage.setItem('rememberMe', 'true');
            localStorage.setItem('rememberedEmail', email);
          } else {
            localStorage.removeItem('rememberMe');
            localStorage.removeItem('rememberedEmail');
          }
          
          window.location.replace('{{ url_for("pages.index") }}');
        } else {
          showAlert(data.error || 'Authentication failed.');
          setLoading(false);
        }
      } catch (_) {
        showAlert('Cannot reach server. Run: python run.py');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
